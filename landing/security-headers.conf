# Cabeceras de seguridad de la landing.
# Se incluye en cada `location` a propósito: nginx descarta los `add_header` del
# server cuando un location define uno propio (mismo motivo que en dashboard-web).
#
# La CSP permite lo que la página realmente usa y nada más: sus propios estilos y
# guiones, la tipografía de Google, y llamadas al mismo origen (el proxy /api).
# Sin `unsafe-inline` ni `unsafe-eval`: el guion vive en app.js, no en la página.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; form-action 'none'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
