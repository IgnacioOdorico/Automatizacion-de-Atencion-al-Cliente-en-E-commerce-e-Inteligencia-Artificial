# ============================================================
#  Atendo — landing de presentación
#  Sirve el sitio estático y reenvía /api/ al portal (dashboard-api:8000).
#  Ese proxy es lo que permite que el chat hable con el asistente sin CORS:
#  para el navegador, la landing y la API son el mismo origen.
#  Solo se exponen los tres endpoints públicos: /demo/chat, /demo/order y /demo/stats.
#  Todo lo demás de la API queda fuera de alcance desde acá.
# ============================================================

server {
    listen 80;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 64k;

    # El upstream se resuelve en cada pedido: si dashboard-api cambia de IP al
    # reconstruirse, nginx no queda clavado en la vieja (mismo arreglo que el portal).
    resolver 127.0.0.11 valid=10s ipv6=off;

    include /etc/nginx/conf.d/security-headers.conf;

    # --- API pública de la demostración -----------------------------------
    location ~ ^/api/demo/(chat|order|stats)$ {
        include /etc/nginx/conf.d/security-headers.conf;
        set $portal "http://dashboard-api:8000";
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $portal;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # El asistente puede tardar unos segundos en contestar: la espera del
        # endpoint es de 45 s, así que el proxy tiene que aguantar un poco más.
        proxy_read_timeout 60s;
    }

    # Cualquier otra ruta bajo /api no existe para la landing.
    location /api/ {
        include /etc/nginx/conf.d/security-headers.conf;
        return 404;
    }

    location /assets/ {
        include /etc/nginx/conf.d/security-headers.conf;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    location / {
        include /etc/nginx/conf.d/security-headers.conf;
        try_files $uri $uri/ /index.html;
    }
}
