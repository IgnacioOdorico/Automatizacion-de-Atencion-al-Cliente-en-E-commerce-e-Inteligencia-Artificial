# ============================================================
#  webhook-gateway — único punto de entrada público (vía ngrok) hacia n8n
#
#  Perfil "tunnel" del docker-compose. ngrok apunta a este nginx (webhook-gateway:80),
#  NUNCA a n8n directo: n8n crudo publicaría el editor (basic auth) y todos los webhooks
#  del pipeline (/webhook/orden-nueva, /webhook/whatsapp-business) sin autenticación.
#
#  ALLOWLIST estricta. Se reenvía UNA sola ruta:
#      POST /webhook/<uuid>/webhook      <- el webhook del Telegram Trigger de n8n
#  Todo lo demás (editor, /rest/*, /webhook-test/*, /webhook/orden-nueva,
#  /webhook/whatsapp-business, /healthz, GET, HEAD, ...) responde 404 desde acá y NO llega a n8n.
#
#  Este archivo se monta de solo lectura en /etc/nginx/conf.d/default.conf, o sea que queda
#  dentro del bloque http {}: por eso puede declarar limit_req_zone y map en el nivel superior.
# ============================================================

# Rate limit básico. Detrás de ngrok todas las requests llegan de la misma IP (la del
# contenedor ngrok), así que la clave es "global": protege a n8n de una ráfaga, no distingue
# clientes. Telegram entrega unos pocos updates por segundo como mucho.
limit_req_zone $binary_remote_addr zone=n8n_hook:1m rate=20r/s;
limit_req_status 429;

# X-Forwarded-Proto: ngrok manda "https"; si falta (prueba local) se usa el esquema propio.
map $http_x_forwarded_proto $fwd_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80 default_server;
    server_name _;
    server_tokens off;

    # DNS embebido de Docker. Con el upstream en una variable nginx re-resuelve `n8n` en cada
    # request: si n8n se recrea y cambia de IP el gateway sigue andando, y tampoco falla al
    # arrancar si n8n todavía no existe.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Tope de body: un update de Telegram pesa pocos KB.
    client_max_body_size 64k;
    client_header_timeout 10s;
    client_body_timeout 10s;
    keepalive_timeout 15s;
    large_client_header_buffers 4 8k;

    default_type text/plain;

    # ---- Única ruta permitida: webhook del Telegram Trigger -------------------------------
    # UUID en minúsculas (n8n asigna un UUID como webhookId al nodo). El match se hace sobre el
    # URI ya decodificado y normalizado: `..`, `%2e`, `//` o mayúsculas no lo satisfacen.
    # (Entre comillas: nginx interpreta las llaves de {8} como bloque si no.)
    location ~ "^/webhook/[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}/webhook$" {
        # Solo POST y sin query string: Telegram no manda ninguna de las dos cosas.
        if ($request_method != POST) {
            return 404 "not found\n";
        }
        if ($args != "") {
            return 404 "not found\n";
        }

        limit_req zone=n8n_hook burst=40 nodelay;

        set $n8n_upstream http://n8n:5678;
        # Se arma con $uri (ya validado por la regex de arriba: solo [0-9a-f/-] y "webhook"),
        # no con el URI crudo del cliente.
        proxy_pass $n8n_upstream$uri;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $fwd_proto;

        # Credenciales de n8n o de una sesión: nunca se reenvían desde internet. El header
        # X-Telegram-Bot-Api-Secret-Token SÍ pasa (n8n lo valida en el Telegram Trigger).
        proxy_set_header Authorization "";
        proxy_set_header Proxy-Authorization "";
        proxy_set_header Cookie "";
        proxy_set_header X-N8N-API-KEY "";
    }

    # ---- Ruta permitida nº 2: webhook del Telegram Trigger del chatbot --------------------
    # El Flujo 2 registró su trigger con un webhookId escrito a mano en el JSON
    # (`telegram-prod-webhook-001`), no con un UUID, así que la regex de arriba lo rechaza.
    # Se permite esa ruta EXACTA en vez de aflojar el patrón: cualquier otro webhook de
    # n8n —incluidos /webhook/orden-nueva y /webhook/whatsapp-business— sigue dando 404.
    location = "/webhook/telegram-prod-webhook-001/webhook" {
        if ($request_method != POST) {
            return 404 "not found
";
        }
        if ($args != "") {
            return 404 "not found
";
        }

        limit_req zone=n8n_hook burst=40 nodelay;

        set $n8n_upstream http://n8n:5678;
        proxy_pass $n8n_upstream$uri;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $fwd_proto;

        proxy_set_header Authorization "";
        proxy_set_header Proxy-Authorization "";
        proxy_set_header Cookie "";
        proxy_set_header X-N8N-API-KEY "";
    }

    # ---- Todo lo demás: 404 ---------------------------------------------------------------
    location / {
        return 404 "not found\n";
    }
}

# Listener de salud, SOLO en loopback del contenedor: lo usa el healthcheck de Docker y no es
# alcanzable desde ngrok ni desde otros contenedores (el listener público es el :80 de arriba).
server {
    listen 127.0.0.1:8081;
    access_log off;

    location = /healthz {
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        return 404;
    }
}
