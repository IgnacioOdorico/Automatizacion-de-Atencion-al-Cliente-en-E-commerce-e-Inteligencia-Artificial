# ============================================================
#  TESIS UTN FRM — Pipeline Post-Venta E-commerce con n8n
#  "Automatización del ciclo post-venta en e-commerce:
#   pipeline de procesamiento de órdenes y atención al cliente
#   omnicanal con IA, implementado con n8n"
#
#  Autores: Santiago Sordi, Ignacio Odorico, Juan Cruz Ana
#  Tutor:   Prof. Alberto Cortez
#
#  Servicios:
#    n8n      → Orquestador (Flujo 1: pipeline órdenes + Flujo 2: chatbot IA)
#    postgres → Base de datos unificada (ambos flujos)
#    mailpit  → SMTP local para emails de confirmación (Flujo 1)
#    grafana  → Dashboard de métricas MTTD/MTTR/TMR (para la tesis)
#
#  Levantar:  docker compose up -d
#  Detener:   docker compose down
#  Ver logs:  docker compose logs -f n8n
# ============================================================

services:

  # ----------------------------------------------------------
  # n8n — Orquestador principal
  # Ejecuta ambos flujos:
  #   Flujo 1: Pipeline de procesamiento de órdenes (webhook → BD → email)
  #   Flujo 2: Chatbot omnicanal con IA (WhatsApp/Telegram/Email → IA → respuesta)
  # Acceso: http://localhost:5678
  # ----------------------------------------------------------
  n8n:
    image: n8nio/n8n:2.12.2
    container_name: tesis_n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      # WEBHOOK_URL: URL pública HTTPS para que el Telegram Trigger registre su
      # webhook (n8n 2.x removió el --tunnel interno). Para la demo se usa ngrok:
      #   1) ngrok http 5678   → devuelve https://XXXX.ngrok-free.dev
      #   2) export WEBHOOK_URL=https://XXXX.ngrok-free.dev/   (o setearla en un .env)
      #   3) recrear n8n. Sin esto queda en localhost y Telegram no se registra.
      # En producción se reemplaza por un dominio propio con HTTPS.
      - WEBHOOK_URL=${WEBHOOK_URL:-http://localhost:5678/}
      # Conexión a PostgreSQL (BD interna de n8n + datos del proyecto)
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=ecommerce_tesis
      - DB_POSTGRESDB_USER=n8n_user
      - DB_POSTGRESDB_PASSWORD=${POSTGRES_PASSWORD:-n8n_pass}
      # Autenticación web
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=admin
      - N8N_BASIC_AUTH_PASSWORD=${N8N_PASSWORD:-admin123}
      # SMTP — apunta a Mailpit local (Flujo 1: emails de confirmación)
      - N8N_EMAIL_MODE=smtp
      - N8N_SMTP_HOST=mailpit
      - N8N_SMTP_PORT=1025
      - N8N_SMTP_SENDER=tesis@ecommerce.local
      # Mailpit escucha SMTP PLANO en el 1025. n8n asume SSL por defecto
      # (N8N_SMTP_SSL=true), asi que sin estas dos lineas el handshake muere con
      # "SSL routines: wrong version number" y NINGUN mail de la instancia sale:
      # ni el de reseteo de contrasena ni el aviso de fallo en produccion.
      - N8N_SMTP_SSL=false
      - N8N_SMTP_STARTTLS=false
      # Timezone Argentina
      - GENERIC_TIMEZONE=America/Argentina/Mendoza
      - TZ=America/Argentina/Mendoza
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY:?definir en .env}
      # Secreto compartido con el dashboard-api (header X-N8N-SECRET del
      # workflow de vínculo). Debe ser el MISMO valor que DASHBOARD_N8N_SECRET.
      # Sin default: se define en .env (el dashboard-api no arranca sin él).
      - DASHBOARD_N8N_SECRET=${DASHBOARD_N8N_SECRET:-}
      # Token del bot de Telegram dedicado al vínculo de cuenta (llamado desde
      # el workflow "Flujo 3 — Telegram Vínculo de Cuenta"). Se crea con
      # @BotFather y se referencia en la credencial como {{ $env.DASHBOARD_BOT_TOKEN_VINCULO }}.
      - DASHBOARD_BOT_TOKEN_VINCULO=${DASHBOARD_BOT_TOKEN_VINCULO:-}
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - tesis_network

  # ----------------------------------------------------------
  # PostgreSQL 15 — Base de datos unificada
  # Contiene tablas de ambos flujos:
  #   Flujo 1: products, orders, pipeline_events
  #   Flujo 2: interactions, tickets, faq_responses
  # Host: localhost:5432 | BD: ecommerce_tesis
  # ----------------------------------------------------------
  postgres:
    image: postgres:15.13-alpine
    container_name: tesis_postgres
    restart: unless-stopped
    ports:
      # Host 5433 -> contenedor 5432. Se usa 5433 en el host para NO chocar con
      # un PostgreSQL nativo de Windows que ya ocupa el 5432. n8n y Grafana usan
      # la red interna (host "postgres", puerto 5432), no se ven afectados.
      - "5433:5432"
    environment:
      POSTGRES_DB: ecommerce_tesis
      POSTGRES_USER: n8n_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-n8n_pass}
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./init_simple.sql:/docker-entrypoint-initdb.d/01_init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U n8n_user -d ecommerce_tesis"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tesis_network

  # ----------------------------------------------------------
  # Mailpit — Servidor SMTP local (simula emails reales)
  # Usado por Flujo 1 para enviar confirmaciones de orden
  # Bandeja de entrada: http://localhost:8025
  # SMTP interno: mailpit:1025
  # ----------------------------------------------------------
  mailpit:
    image: axllent/mailpit:v1.29.6
    container_name: tesis_mailpit
    restart: unless-stopped
    ports:
      - "8025:8025"   # Interfaz web para ver emails
      - "1025:1025"   # Puerto SMTP
    networks:
      - tesis_network

  # ----------------------------------------------------------
  # Grafana — Dashboard de métricas para la tesis
  # Conecta a PostgreSQL y visualiza las vistas:
  #   v_order_processing_time  → MTTD/MTTR (Flujo 1)
  #   v_chatbot_response_time  → TMR (Flujo 2)
  #   v_metrics_summary        → Resumen ejecutivo
  # Acceso: http://localhost:3000 (usuario admin; contrasena via GRAFANA_PASSWORD)
  # ----------------------------------------------------------
  grafana:
    image: grafana/grafana:13.0.7
    container_name: tesis_grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - postgres
    networks:
      - tesis_network

  # ----------------------------------------------------------
  # Dashboard API — Backend FastAPI del portal del cliente
  # Lee las tablas y vistas de la BD (no las modifica).
  # Acceso: http://localhost:8000 (docs en /docs)
  # Variables: ver .env.example (DASHBOARD_*).
  # FAIL-CLOSED: DASHBOARD_JWT_SECRET, DASHBOARD_ENC_KEY y DASHBOARD_N8N_SECRET no
  # tienen default. Si faltan en .env (o son débiles/de ejemplo) la API se niega a
  # arrancar y el contenedor lo dice en sus logs (`docker compose logs dashboard-api`).
  # ----------------------------------------------------------
  dashboard-api:
    build: ./dashboard-api
    container_name: tesis_dashboard_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      # Dentro de la red Docker el host de Postgres es "postgres", no localhost.
      - DATABASE_URL=postgresql+psycopg://n8n_user:${POSTGRES_PASSWORD:-n8n_pass}@postgres:5432/ecommerce_tesis
      - DASHBOARD_JWT_SECRET=${DASHBOARD_JWT_SECRET:-}
      - DASHBOARD_ENC_KEY=${DASHBOARD_ENC_KEY:-}
      - DASHBOARD_N8N_SECRET=${DASHBOARD_N8N_SECRET:-}
      # Google OAuth2 (modo testing) para conectar Gmail. Placeholders: se
      # completan en .env con las credenciales de Google Cloud Console.
      - DASHBOARD_GOOGLE_CLIENT_ID=${DASHBOARD_GOOGLE_CLIENT_ID:-}
      - DASHBOARD_GOOGLE_CLIENT_SECRET=${DASHBOARD_GOOGLE_CLIENT_SECRET:-}
      - DASHBOARD_GOOGLE_REDIRECT_URI=${DASHBOARD_GOOGLE_REDIRECT_URI:-}
      # URL del frontend para la redirección post-callback de Gmail. En Docker el
      # front sale por :8080; si desarrollás con Vite (:5173), pisala en .env.
      - DASHBOARD_FRONTEND_URL=${DASHBOARD_FRONTEND_URL:-http://localhost:8080}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:5173,http://localhost:8080}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - "CMD"
        - "python"
        - "-c"
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tesis_network

# ----------------------------------------------------------
  # Dashboard Web — Frontend del portal del cliente (React Vite + nginx)
  # Sirve el build estático y proxya /api -> dashboard-api:8000.
  # Acceso: http://localhost:8080
  # ----------------------------------------------------------
  dashboard-web:
    build: ./dashboard-web
    container_name: tesis_dashboard_web
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - dashboard-api
    networks:
      - tesis_network

# ----------------------------------------------------------
# Volúmenes persistentes
# ----------------------------------------------------------
volumes:
  n8n_data:       # Configuración y workflows de n8n
  pg_data:        # Datos de PostgreSQL
  grafana_data:   # Dashboards y config de Grafana

# ----------------------------------------------------------
# Red interna (los contenedores se comunican por nombre)
# ----------------------------------------------------------
networks:
  tesis_network:
    driver: bridge
