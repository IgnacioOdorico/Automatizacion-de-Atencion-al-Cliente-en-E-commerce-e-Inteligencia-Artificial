<style>
 :root{--bg:#12131a;--card:#1c1e28;--bd:#2e3140;--fg:#e8eaf2;--mut:#9aa0b5;

 *{box-sizing:border-box}
 body{margin:0;background:var(--bg);color:var(--fg);

 button:hover{border-color:var(--ac);background:#282c3c}

<script>
const EVALUADOR = "maximo_muguruza";
const NOMBRE    = "Máximo Muguruza";
const FAQS      = [{"q": "¿Cuáles son los métodos de pago?", "a": "Aceptamos tarjeta de crédito, débito, transferencia bancaria y MercadoPago. Todos los pagos son procesados de forma segura.", "c": "Pagos"}, {"q": "¿Cuánto tarda el envío?", "a": "Los envíos dentro de Mendoza tardan 1-3 días hábiles. Para el resto del país, entre 3-7 días hábiles. Te notificamos por email cuando tu pedido sea despachado.", "c": "Envíos"}, {"q": "¿Cómo puedo devolver un producto?", "a": "Tenés 30 días desde la recepción para iniciar una devolución. Escribinos indicando tu número de pedido y el motivo, y te guiamos en el proceso.", "c": "Devoluciones"}, {"q": "¿Tienen garantía los productos?", "a": "Todos nuestros productos tienen garantía oficial del fabricante. La duración varía según el producto (generalmente 12 meses). Guardá tu comprobante de compra.", "c": "Garantía"}, {"q": "¿Cómo contacto a soporte?", "a": "Podés escribirnos por WhatsApp, Telegram o email. Nuestro sistema de IA te asiste 24/7 y, si es necesario, escala tu caso a un agente humano.", "c": "Soporte"}, {"q": "¿Hacen factura?", "a": "Sí, emitimos factura electrónica (AFIP) para todas las compras. La factura se envía automáticamente al email registrado en tu pedido.", "c": "Facturación"}, {"q": "¿Puedo pagar en cuotas?", "a": "Sí, con tarjetas de crédito Visa, Mastercard y American Express podés pagar en hasta 12 cuotas sin interés en productos seleccionados. Las cuotas disponibles se muestran en el checkout.", "c": "Pagos"}, {"q": "¿Es seguro pagar con tarjeta en la web?", "a": "Totalmente. Usamos encriptación SSL y procesamos los pagos a través de MercadoPago, que cumple con los estándares PCI-DSS. Nunca almacenamos los datos de tu tarjeta.", "c": "Pagos"}, {"q": "¿Hacen envíos a todo el país?", "a": "Sí, enviamos a todo el territorio argentino. Trabajamos con OCA, Andreani y correo argentino. El costo de envío se calcula en el checkout según tu código postal.", "c": "Envíos"}, {"q": "¿Puedo hacer el seguimiento de mi envío?", "a": "Sí. Una vez despachado tu pedido, te enviamos un email con el número de tracking y el enlace directo para seguir el paquete en tiempo real.", "c": "Envíos"}, {"q": "¿Hacen envíos internacionales?", "a": "Por el momento solo enviamos dentro de Argentina. Estamos trabajando para expandir a países limítrofes próximamente.", "c": "Envíos"}, {"q": "¿Qué pasa si no estoy en casa cuando llega el pedido?", "a": "El transportista deja un aviso y hace un segundo intento al día siguiente. Si tampoco podés recibirlo, el paquete queda disponible para retiro en la sucursal más cercana por 5 días hábiles.", "c": "Envíos"}, {"q": "¿Cuál es la política de cambios?", "a": "Podés cambiar un producto dentro de los 30 días de recibido, siempre que esté en su embalaje original y sin uso. Los gastos de envío del cambio corren por nuestra cuenta si el error fue nuestro.", "c": "Devoluciones"}, {"q": "¿Cómo inicio una devolución?", "a": "Escribinos por este chat o al email devoluciones@techstore.com.ar con tu número de pedido y el motivo. Te enviamos una etiqueta prepaga para el retiro en 24hs hábiles.", "c": "Devoluciones"}, {"q": "¿Qué cubre la garantía?", "a": "La garantía cubre defectos de fabricación. NO cubre daños por mal uso, caídas, líquidos o modificaciones no autorizadas. Ante cualquier falla, contactanos y gestionamos el service con el fabricante.", "c": "Garantía"}, {"q": "¿Cómo hago válida la garantía?", "a": "Guardá el comprobante de compra (te lo enviamos por email). Si el producto falla, escribinos con foto o video del problema y tu número de pedido. Nos encargamos de todo el proceso de garantía.", "c": "Garantía"}, {"q": "¿Los productos son originales?", "a": "Sí, todos nuestros productos son 100% originales con garantía oficial del fabricante. Somos distribuidores autorizados de todas las marcas que comercializamos.", "c": "Productos"}, {"q": "¿Tienen stock en físico para retirar?", "a": "Por el momento somos una tienda 100% online y no contamos con local a la calle. Todos los pedidos se despachan desde nuestro depósito en Mendoza.", "c": "Productos"}, {"q": "¿Cómo sé si un producto tiene stock?", "a": "Si podés agregarlo al carrito, hay stock disponible. Si aparece como \"Sin stock\", podés anotarte en la lista de espera y te avisamos cuando vuelva a estar disponible.", "c": "Productos"}, {"q": "¿Hacen factura A para empresas?", "a": "Sí, emitimos factura A para responsables inscriptos. Durante el checkout elegís el tipo de comprobante e ingresás el CUIT y razón social de tu empresa.", "c": "Facturación"}, {"q": "¿Cuándo recibo la factura?", "a": "La factura electrónica se genera automáticamente al confirmar el pago y te llega por email en minutos. Si no la recibís, revisá la carpeta de spam o escribinos.", "c": "Facturación"}, {"q": "¿Puedo cancelar un pedido?", "a": "Podés cancelar sin costo dentro de las 2 horas de realizado, siempre que no haya sido despachado. Después del despacho, el proceso es una devolución normal.", "c": "Pedidos"}, {"q": "¿Cómo recibo el comprobante de compra?", "a": "Te enviamos un email de confirmación inmediatamente después del pago con todos los detalles del pedido y la factura adjunta.", "c": "Pedidos"}];
const DATOS     = [{"id": "238", "m": "cuanto tarda el envio? porque el mio ya lleva 8 dias", "r": "¡Hola Anotador E2! Te cuento que los envíos dentro de Argentina suelen tardar entre 3 y 7 días hábiles. Como ya pasaron 8 días, lamento la demora. ¿Me pasás el número de tu pedido para que pueda verificar el estado del envío y ayudarte con esto?"}, {"id": "323", "m": "tienen atencion telefonica?", "r": "¡Hola Anotador E2! Actualmente, no contamos con atención telefónica, pero podés contactarnos por WhatsApp, Telegram o email. Estamos aquí para ayudarte en lo que necesites. ¿Hay algo más en lo que te pueda asistir?"}, {"id": "374", "m": "como se calcula el costo de envio?", "r": "¡Hola Anotador E2! El costo de envío se calcula en el checkout según tu código postal y el peso del paquete. Asegurate de ingresar tu dirección para ver el monto exacto antes de finalizar la compra. ¿Hay algo más en lo que pueda ayudarte?"}, {"id": "370", "m": "cuanto tiempo de garantia tienen las notebooks?", "r": "¡Hola Anotador E2! Las notebooks tienen garantía oficial del fabricante, que generalmente es de 12 meses. Es importante que guardes tu comprobante de compra. ¿Te gustaría saber algo más sobre las notebooks o algún otro producto?"}, {"id": "301", "m": "que metodos de pago aceptan?", "r": "¡Hola Anotador E2! Aceptamos los siguientes métodos de pago:\n1. **Tarjeta de crédito**: Visa, Mastercard y American Express.\n2. **Tarjeta de débito**\n3. **Transferencia bancaria**\n4. **MercadoPago**\n\nTodos los pagos son procesados de forma segura. ¿Hay algo más en lo que te pueda ayudar?"}, {"id": "334", "m": "los envios son con seguro?", "r": "¡Hola Anotador E2! Los envíos que realizamos no incluyen seguro de manera automática. Sin embargo, podés optar por agregar un seguro en el proceso de checkout si deseas proteger tu paquete. ¿Hay algo más en lo que pueda ayudarte?"}, {"id": "341", "m": "puedo comprar sin registrarme?", "r": "¡Hola Anotador E2! Sí, podés comprar sin registrarte en nuestra tienda online. Solo tenés que completar tus datos de envío y pago al momento de realizar la compra. Si necesitás ayuda en el proceso, no dudes en preguntarme. ¿Hay algo más en lo que te pueda ayudar?"}, {"id": "239", "m": "puedo pagar en cuotas?", "r": "¡Hola Anotador E2! Sí, podés pagar en cuotas con tarjetas de crédito Visa, Mastercard y American Express. Ofrecemos hasta 12 cuotas sin interés en productos seleccionados y las cuotas disponibles se muestran en el checkout. ¿Necesitás ayuda con algo más?"}, {"id": "326", "m": "cual es el horario de atencion?", "r": "¡Hola Anotador E2! Nuestro horario de atención es de lunes a viernes de 9 a 18 hs. Si tenés alguna consulta o necesitas ayuda, no dudes en escribirme. ¿Hay algo más en lo que te pueda ayudar?"}, {"id": "372", "m": "hola queria saber si les llego mi transferencia", "r": "¡Hola Anotador E2! Para verificar si tu transferencia ya ha llegado, necesitaría saber tu número de pedido. ¿Podés compartírmelo, por favor? Así puedo ayudarte mejor."}, {"id": "243", "m": "cual es la politica de cambios?", "r": "¡Hola Anotador E2! Te cuento que podés cambiar un producto dentro de los 30 días de recibido, siempre que esté en su embalaje original y sin uso. Si el error fue nuestro, los gastos de envío del cambio corren por nuestra cuenta. ¿Hay algo más en lo que te pueda ayudar?"}, {"id": "291", "m": "hasta cuantas cuotas sin interes hay?", "r": "¡Hola Anotador E2! Podés pagar en hasta 12 cuotas sin interés en productos seleccionados, utilizando tarjetas de crédito Visa, Mastercard y American Express. Las cuotas disponibles se muestran en el checkout. ¿Te puedo ayudar con algo más?"}, {"id": "258", "m": "aceptan mercado pago?", "r": "¡Hola Anotador E2! Sí, aceptamos MercadoPago como método de pago. Podés usarlo de forma segura al realizar tu compra en nuestra tienda. Si tenés alguna otra consulta, no dudes en decírmelo."}, {"id": "319", "m": "si el producto no me gusta lo puedo devolver?", "r": "¡Hola Anotador E2! Sí, podés devolver un producto si no te gusta. Tenés 30 días desde la recepción para iniciar la devolución. Solo necesitás escribinos indicando tu número de pedido y el motivo, y te guiamos en el proceso. ¿Hay algo más en lo que te pueda ayudar?"}, {"id": "305", "m": "la garantia la cubre la marca o ustedes?", "r": "¡Hola Anotador E2! La garantía de nuestros productos es oficial del fabricante. Esto significa que si hay algún defecto de fabricación, deberás contactarte con nosotros, y nosotros gestionaremos el servicio de garantía con la marca. Asegurate de mantener el comprobante de compra. ¿Hay algo más en lo que te pueda ayudar?"}, {"id": "309", "m": "hacen descuento por pago en efectivo?", "r": "¡Hola Anotador E2! Actualmente no ofrecemos descuentos adicionales por pago en efectivo. Sin embargo, sí tenés la opción de pagar en cuotas con tarjeta de crédito en productos seleccionados. ¿Hay algo más en lo que pueda ayudarte?"}, {"id": "298", "m": "puedo cambiar la direccion de envio despues de comprar?", "r": "¡Hola Anotador E2! Una vez que el pedido ha sido realizado, no es posible cambiar la dirección de envío. Si te das cuenta del error, te recomendamos cancelar el pedido (si está dentro del plazo) y realizar uno nuevo con la dirección correcta. ¿Te gustaría que te ayude con algo más?"}, {"id": "287", "m": "los precios incluyen iva?", "r": "¡Hola Anotador E2! Sí, todos nuestros precios incluyen IVA. Cuando realices tu compra, el total que verás ya tiene el impuesto incluido. ¿Hay algo más en lo que te pueda ayudar?"}, {"id": "345", "m": "hacen envio gratis a partir de cierto monto?", "r": "¡Hola Anotador E2! Actualmente, no ofrecemos envíos gratis a partir de un monto específico. El costo del envío se calcula en el checkout según tu código postal. Si tenés alguna otra consulta o necesitás más información, ¡aquí estoy para ayudar!"}, {"id": "365", "m": "buenas, cuando estiman que llega el pedido a mendoza?", "r": "¡Hola Anotador E2! Los envíos dentro de Mendoza tardan entre 1 y 3 días hábiles una vez despachado el pedido. Te notificamos por email tan pronto como tu pedido sale de nuestro depósito. ¿Te puedo ayudar con algo más?"}, {"id": "359", "m": "puedo pedir que lo dejen con el portero?", "r": "¡Hola Anotador E2! Sí, podés pedir que tu paquete sea dejado con el portero. Te sugerimos que lo especifiques en las observaciones al momento de realizar el pedido. Si ya lo compraste, podés comunicarte con el transportista para solicitarlo. ¿Puedo ayudarte con algo más?"}, {"id": "280", "m": "cuantos dias tengo para devolver algo?", "r": "¡Hola Anotador E2! Tenés 30 días desde la recepción para iniciar una devolución. Si decidís devolver algo, escribinos indicando tu número de pedido y el motivo, y te guiamos en el proceso. ¿Hay algo más en lo que te pueda ayudar?"}, {"id": "356", "m": "tienen reembolso si el producto llega roto?", "r": "¡Hola Anotador E2! Entiendo que esta es una inquietud importante. Si el producto llega roto, ofrecemos un proceso de devolución y reembolso. Solo tenés que contactarnos con tu número de pedido y una descripción del problema, y te guiaremos en el proceso. ¿Necesitás ayuda con algo más?"}, {"id": "357", "m": "buenas, se puede cancelar un pedido ya pagado?", "r": "¡Hola Anotador E2! Podés cancelar tu pedido sin costo dentro de las 2 horas de haberlo realizado, siempre que no haya sido despachado. Si ya pasaron esas 2 horas, tendremos que gestionar una devolución normal. ¿Hay algo más en lo que te pueda ayudar?"}, {"id": "253", "m": "cuanto sale el envio a cordoba?", "r": "¡Hola Anotador E2! El costo de envío a Córdoba se calcula en el checkout, según tu código postal. Una vez que ingreses tu dirección, se mostrará el costo exacto del envío. ¿Hay algo más en lo que te pueda ayudar?"}, {"id": "277", "m": "tienen local fisico para retirar?", "r": "¡Hola! Actualmente somos una tienda 100% online y no contamos con un local físico para retiros. Todos los pedidos se despachan desde nuestro depósito en Mendoza. ¿Hay algo más en lo que te pueda ayudar?"}, {"id": "349", "m": "venden productos usados o todos son nuevos?", "r": "¡Hola Anotador E2! Todos nuestros productos son 100% originales y nuevos, con garantía oficial del fabricante. Si tenés alguna otra duda o pregunta, no dudes en consultarme. ¡Estoy aquí para ayudarte!"}, {"id": "312", "m": "cuanto cuesta el envio si compro mas de un producto?", "r": "¡Hola Anotador E2! El costo de envío se calcula automáticamente en el checkout según tu código postal y el peso total de los productos. Si comprás más de un producto, puede que se aplique un solo costo de envío, lo que a veces es más conveniente. ¿Hay algo más en lo que te pueda ayudar?"}, {"id": "269", "m": "hacen envios internacionales?", "r": "¡Hola Anotador E2! Por el momento, solo hacemos envíos dentro de Argentina. Estamos trabajando para expandir a países limítrofes próximamente. ¿Hay algo más en lo que te pueda ayudar?"}, {"id": "262", "m": "cuanto tarda el envio normalmente?", "r": "¡Hola Anotador E2! Los envíos dentro de Mendoza tardan entre 1 y 3 días hábiles, y para el resto del país, entre 3 y 7 días hábiles una vez que el pedido es despachado. Te notificamos por email cuando tu pedido salga de nuestro depósito. ¿Hay algo más en lo que te pueda ayudar?"}, {"id": "378", "m": "puedo pagar contra entrega?", "r": "¡Hola Anotador E2! Actualmente no ofrecemos la opción de pago contra entrega. Aceptamos tarjeta de crédito, débito, transferencia bancaria y MercadoPago como métodos de pago disponibles. Si tenés alguna otra consulta, ¡no dudes en preguntar!"}, {"id": "273", "m": "es seguro pagar con tarjeta en la web?", "r": "¡Hola Anotador E2! Sí, es totalmente seguro pagar con tarjeta en nuestra web. Usamos encriptación SSL y procesamos los pagos a través de MercadoPago, que cumple con los estándares de seguridad. No almacenamos los datos de tu tarjeta. ¿Hay algo más en lo que te pueda ayudar?"}, {"id": "330", "m": "emiten factura B?", "r": "¡Hola Anotador E2! Sí, emitimos factura B para nuestros clientes. Durante el proceso de compra, podés seleccionar el tipo de comprobante que necesitás. ¿Te gustaría saber algo más?"}, {"id": "316", "m": "puedo retirar por sucursal?", "r": "¡Hola Anotador E2! Por el momento somos una tienda 100% online y no contamos con opciones de retiro en sucursal. Todos los pedidos se despachan desde nuestro depósito en Mendoza. Si tenés alguna otra consulta, no dudes en preguntar."}, {"id": "363", "m": "aceptan tarjeta de debito?", "r": "¡Hola Anotador E2! Sí, aceptamos tarjeta de débito como método de pago. Podés pagar de forma segura a través de nuestro sistema. ¿Hay algo más en lo que te pueda ayudar?"}, {"id": "284", "m": "aceptan transferencia bancaria?", "r": "¡Hola Anotador! Sí, aceptamos transferencia bancaria como método de pago. Es una opción segura y fácil de utilizar. ¿Hay algo más en lo que te pueda ayudar?"}, {"id": "362", "m": "me llego un mail que decia confirmado, eso significa que ya lo mandaron?", "r": "¡Hola Anotador E2! Recibir un email de 'confirmado' significa que tu pedido ha sido procesado correctamente. Sin embargo, para saber si ya fue despachado, te recomiendo que esperes un email adicional que te informará sobre el envío y te dará un número de seguimiento. ¿Necesitás ayuda con algo más?"}, {"id": "294", "m": "trabajan con oca o andreani?", "r": "¡Hola Anotador E2! Sí, trabajamos con OCA y Andreani para los envíos. Ambos son confiables y nos ayudan a asegurar que tu pedido llegue a tiempo. ¿Hay algo más en lo que te pueda ayudar?"}, {"id": "236", "m": "hacen envios a todo el pais?", "r": "¡Hola Anotador E2! Sí, hacemos envíos a todo el territorio argentino. El costo de envío se calcula en el checkout según tu código postal. ¿Hay algo más en lo que te pueda ayudar?"}, {"id": "337", "m": "cuanto demora el reintegro de una devolucion?", "r": "¡Hola Anotador E2! El reintegro de una devolución suele demorarse entre 5 y 10 días hábiles desde que recibimos el producto en nuestro depósito. Te enviamos un email de confirmación una vez que se procesa. ¿Puedo ayudarte con algo más?"}, {"id": "254", "m": "hola, compre ayer y queria saber si me pueden hacer factura A", "r": "¡Hola Anotador E2! Sí, podemos emitir factura A para responsables inscriptos. Durante el checkout, tenés que seleccionar el tipo de comprobante y completar tu CUIT y razón social. Si necesitás ayuda con tu pedido, no dudes en decírmelo. ¿Hay algo más en lo que te pueda ayudar?"}, {"id": "352", "m": "si pago con transferencia cuando despachan?", "r": "¡Hola Anotador E2! Si pagás con transferencia, despachamos tu pedido una vez que tengamos confirmación del pago, lo que suele tardar unas 24 horas hábiles. Te avisamos por email cuando tu pedido está en camino. ¿Hay algo más en lo que te pueda ayudar?"}, {"id": "265", "m": "si no estoy en casa cuando llega el pedido que pasa?", "r": "¡Hola Anotador E2! Si no estás en casa cuando llega el pedido, el transportista dejará un aviso y hará un segundo intento al día siguiente. Si en ese segundo intento tampoco podés recibirlo, el paquete quedará disponible para su retiro en la sucursal más cercana durante 5 días hábiles. ¿Hay algo más en lo que te pueda ayudar?"}, {"id": "246", "m": "tienen garantia los productos?", "r": "¡Hola Anotador E2! Todos nuestros productos tienen garantía oficial del fabricante, generalmente 12 meses. Es importante que guardes tu comprobante de compra. ¿Hay algo más en lo que pueda ayudarte?"}, {"id": "250", "m": "hacen factura A?", "r": "¡Hola Anotador E2! Sí, emitimos factura A para responsables inscriptos. Durante el checkout podés elegir el tipo de comprobante e ingresar el CUIT y la razón social de tu empresa. ¿Te gustaría saber algo más?"}];
const NIVELES   = [["A", "Consistente con la política", "La respuesta coincide con lo que dice la base de conocimiento de TechStore."], ["B", "Genérica pero no contradictoria", "La respuesta es correcta para un e-commerce cualquiera, pero no afirma nada que esté en la base de conocimiento; tampoco la contradice."], ["C", "Contradice la política vigente", "La respuesta afirma algo que la base de conocimiento dice de otra manera, o inventa una política que la tienda no tiene."]];

const app = document.getElementById('app');
let i = 0, res = [], t0 = 0;
const CLAVE = 'e6_avance_' + EVALUADOR;
const MITAD = Math.ceil(DATOS.length / 2);
let pausaMostrada = false;

function guardar(){
  try { localStorage.setItem(CLAVE, JSON.stringify({i:i, res:res, pausa:pausaMostrada})); } catch(e){}
}
function leerAvance(){
  try { const v = localStorage.getItem(CLAVE); return v ? JSON.parse(v) : null; } catch(e){ return null; }
}
function borrarAvance(){
  try { localStorage.removeItem(CLAVE); } catch(e){}
}
function reanudar(){
  const a = leerAvance();
  if(!a){ return arrancar(); }
  i = a.i; res = a.res; pausaMostrada = !!a.pausa; render();
}

function tablaFaqs(){
  return `<details><summary>Base de conocimiento de TechStore — las 23 entradas (consultala siempre que dudes)</summary>
    <table><tr><th>Categoría</th><th>Pregunta</th><th>Respuesta oficial</th></tr>
    ${FAQS.map(f=>`<tr><td>${f.c}</td><td>${f.q}</td><td>${f.a}</td></tr>`).join('')}
    </table></details>`;
}

function intro(){
  app.innerHTML = `<h1>Evaluación de respuestas del chatbot</h1>
  <div class="sub">Evaluador: <b>${NOMBRE}</b> · ${DATOS.length} respuestas</div>
  <div class="card">
    <p>Vas a ver <b>${DATOS.length} consultas reales de clientes</b> con la respuesta que
    dio el chatbot. Tu tarea es una sola: decidir si esa respuesta <b>se corresponde con
    la política real de TechStore</b>, que está en la tabla de acá abajo.</p>
    <p><b>No evalúes</b> si la respuesta es simpática, si está bien redactada ni si el
    cliente quedaría contento. Eso no se mide acá. Lo único que importa es si lo que
    afirma es lo que la tienda dice.</p>
    <p>Los tres niveles:</p>
    <table><tr><th>Nivel</th><th>Cuándo</th></tr>
    ${NIVELES.map(n=>`<tr><td><b>${n[0]} — ${n[1]}</b></td><td>${n[2]}</td></tr>`).join('')}
    </table>
    <p style="margin-top:14px"><b>La diferencia entre A y B es la clave del experimento.</b>
    Si la respuesta dice algo que <i>podría</i> ser cierto en cualquier tienda pero que la
    base de conocimiento no afirma, es <b>B</b>, no A. Reservá la <b>A</b> para cuando la
    respuesta se apoya en algo que efectivamente está en la tabla.</p>
    <p>Tomate el tiempo que necesites: se registra cuánto tardás en cada una, y una
    evaluación demasiado rápida se descarta por inválida.</p>
  </div>
  ${tablaFaqs()}
  ${(() => { const a = leerAvance();
     return (a && a.i > 0 && a.i < DATOS.length)
       ? `<div class="card"><p>Tenés una evaluación empezada: vas por la respuesta <b>${a.i + 1} de ${DATOS.length}</b>.
          Tu avance quedó guardado.</p>
          <button class="ini" onclick="reanudar()">Seguir desde la ${a.i + 1}</button></div>`
       : `<button class="ini" onclick="arrancar()">Empezar</button>`; })()}`;
}

function arrancar(){ i=0; res=[]; pausaMostrada=false; borrarAvance(); render(); }

function render(){
  if(i>=DATOS.length) return fin();
  if(i === MITAD && !pausaMostrada){
    pausaMostrada = true; guardar();
    app.innerHTML = `<h1>Llegaste a la mitad</h1>
    <div class="card">
      <p>Evaluaste <b>${i} de ${DATOS.length}</b>. <b>Es un buen momento para parar.</b></p>
      <p>Cotejar respuestas contra la tabla cansa, y una evaluación cansada se nota en los
      tiempos. Si querés, cerrá esta pestaña y seguí más tarde o mañana: tu avance quedó
      guardado y vas a retomar exactamente desde la ${i + 1}.</p>
      <p>Si preferís seguir ahora, tomate un par de minutos antes.</p>
      <button class="ini" onclick="render()">Seguir con la ${i + 1}</button>
    </div>`;
    window.scrollTo(0,0);
    return;
  }
  const d = DATOS[i]; t0 = Date.now();
  app.innerHTML = `<h1>Evaluación de respuestas del chatbot</h1>
  <div class="sub">${NOMBRE} · ${i+1} de ${DATOS.length}</div>
  <div class="prog"><i style="width:${(i/DATOS.length*100).toFixed(1)}%"></i></div>
  <div class="card"><div class="rot">Consulta del cliente</div>
    <div class="msg">${d.m}</div></div>
  <div class="card"><div class="rot">Respuesta que dio el chatbot</div>
    <div class="resp">${d.r}</div></div>
  <div class="btns">
    ${NIVELES.map(n=>`<button class="k${n[0]}" onclick="elegir('${n[0]}')">
        <b>${n[0]} — ${n[1]}</b><span>${n[2]}</span></button>`).join('')}
  </div>
  ${tablaFaqs()}`;
  window.scrollTo(0,0);
}

function elegir(nivel){
  res.push({id:DATOS[i].id, nivel:nivel, segundos:((Date.now()-t0)/1000).toFixed(1)});
  i++; guardar(); render();
}

function fin(){
  const csv = "id,nivel,segundos\n" + res.map(r=>`${r.id},${r.nivel},${r.segundos}`).join("\n");
  const url = URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8"}));
  const tot = res.reduce((a,r)=>a+parseFloat(r.segundos),0);
  app.innerHTML = `<h1>Listo, ${NOMBRE}</h1>
  <div class="card"><p>Evaluaste las <b>${res.length}</b> respuestas en
  ${(tot/60).toFixed(1)} minutos (${(tot/res.length).toFixed(1)} s por respuesta en promedio).</p>
  <p>Descargá el archivo y pasáselo al equipo. <b>No lo compares con el del otro
  evaluador</b>: el acuerdo entre ambos es justamente lo que se mide.</p>
  <a class="dl" href="${url}" download="e6_${EVALUADOR}.csv" onclick="setTimeout(borrarAvance, 1500)">Descargar resultado</a></div>`;
}

intro();
</script></body></html>
