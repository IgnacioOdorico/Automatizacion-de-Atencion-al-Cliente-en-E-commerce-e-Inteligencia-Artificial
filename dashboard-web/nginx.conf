server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # SPA fallback: cualquier ruta que no sea un asset real -> index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Assets estáticos con cache larga (fingerprint de Vite)
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # API: /api/X -> http://dashboard-api:8000/X (el trailing slash reescribe /api)
    location /api/ {
        proxy_pass http://dashboard-api:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}