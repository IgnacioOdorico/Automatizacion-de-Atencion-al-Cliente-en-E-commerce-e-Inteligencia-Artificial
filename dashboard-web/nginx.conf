server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # SPA fallback: cualquier ruta que no sea un asset real -> index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Assets estáticos con cache larga (fingerprint de Vite)
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # DNS embebido de Docker. Con el upstream en una variable nginx re-resuelve
    # `dashboard-api` en cada request (cache de 10s): si la API se recrea y cambia de
    # IP (rebuild, reinicio de Docker) el proxy sigue andando en vez de dar 502 hasta
    # reiniciar este contenedor. Tampoco falla al arrancar si la API aún no existe.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # API: /api/X -> http://dashboard-api:8000/X (el rewrite quita el prefijo /api;
    # el query string se conserva).
    location /api/ {
        set $dashboard_api http://dashboard-api:8000;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $dashboard_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}