# Headers de seguridad del portal. Se incluye desde nginx.conf (server y cada
# location que defina su propio add_header: nginx descarta los del nivel
# superior cuando un location declara uno). `always` los manda también en 4xx/5xx.
#
# CSP (la app es un SPA de Vite sin scripts inline):
#  - script-src 'self'            solo el bundle propio; sin unsafe-inline/unsafe-eval
#  - style-src ... 'unsafe-inline' React usa atributos style="..."; no ejecutan código
#  - fonts.googleapis.com / fonts.gstatic.com   tipografía Inter
#  - connect-src 'self'           el navegador solo habla con este origen (la API va por /api)
#  - frame-ancestors 'none'       no se puede embeber (clickjacking)
# HSTS no se manda: la demo corre por HTTP. Agregarlo al publicar detrás de TLS.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
